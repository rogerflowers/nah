name: Publish Ring Auto Back APK

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-apk.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built APK artifact
        shell: bash
        run: |
          curl -fL 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-2f40-81fb-97e2-f4a93de091bc/raw?se=2026-09-25T06%3A43%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=dcf8fa4e-abc9-5b96-bc65-5d602109b3a9&skoid=80e81ea6-3c08-46f9-bd84-b87176742bcd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T06%3A05%3A23Z&ske=2026-09-26T06%3A05%3A23Z&sks=b&skv=2026-02-06&sig=P50BD9SByRlLxIW8ViS893PN73sjXZgnxQgT3b5vXqE%3D' -o /tmp/RingAutoBack-release.zip
          unzip -j /tmp/RingAutoBack-release.zip '*.apk' -d /tmp/ring-apk
          cp /tmp/ring-apk/*.apk RingAutoBack-FireTV.apk
          test -s RingAutoBack-FireTV.apk
          unzip -t RingAutoBack-FireTV.apk

      - name: Publish APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RingAutoBack-FireTV.apk
          git commit -m "Publish Ring Auto Back v2 APK" || exit 0
          git push
