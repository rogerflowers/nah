name: Publish Ring Auto Back APK

on:
  push:
    branches:
      - master
    paths:
      - '.build/**'
      - '.github/workflows/publish-apk.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble APK
        shell: bash
        run: |
          cat .build/apk_*.b64 > /tmp/ring.apk.b64
          base64 -d /tmp/ring.apk.b64 > RingAutoBack-FireTV.apk
          test -s RingAutoBack-FireTV.apk

      - name: Verify APK archive
        shell: bash
        run: unzip -t RingAutoBack-FireTV.apk

      - name: Commit APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RingAutoBack-FireTV.apk
          git commit -m "Publish Ring Auto Back v2 APK" || exit 0
          git push
